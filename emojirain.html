<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Emoji Rain</title>
  <link rel="icon" type="image/x-icon" href="icon.ico" />
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      position: relative;
      background: #111;
      color: #fff
    }
    #display {
      position: absolute;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }
    .emoji-wrapper {
      position: absolute;
      will-change: transform;
      pointer-events: none;
      user-select: none;
      animation: fall-wrapper linear;
    }
    .emoji {
      display: inline-block;
      will-change: transform;
      pointer-events: none;
      user-select: none;
      /* Animation: rotate emoji as it falls */
      animation: spin-emoji linear;
    }

    @keyframes fall-wrapper {
      0% {
        transform: translateY(0);
        opacity: 1;
      }
      80% {
        opacity: 1;
      }
      100% {
        transform: translateY(calc(100vh + 100px));
      }
    }

    @keyframes spin-emoji {
      0% {
        transform: rotate(var(--emoji-start-rotation, 0deg));
      }
      100% {
        transform: rotate(calc(var(--emoji-start-rotation, 0deg) + 360deg));
      }
    }
  </style>
</head>
<body>
  <div id="display"></div>
</body>
<script src="emojis.js"></script>
<script>
    const plinkSrc = "plinkk.gif";
    const emojis = 2;

    // Maintain blacklist for emoji that fail to render
    const emojiBlacklist = new Set();

    // Enhanced randomEmoji to skip blacklisted ones
    function randomEmoji() {
      // Filter emojiList down to non-blacklisted emojis
      const allowed = emojiList.filter(e => !emojiBlacklist.has(e));
      if (allowed.length === 0) {
        // fallback, if everything is blacklisted, use the full list (should never happen)
        return emojiList[Math.floor(Math.random() * emojiList.length)];
      }
      return allowed[Math.floor(Math.random() * allowed.length)];
    }

    // Check if an emoji is "broken" based on visible rendering behavior.
    // Uses "arrow right" navigation logic: if you set the cursor at the beginning and count how many right-arrow moves it takes to skip all displayed glyphs,
    // if it's more than 1 (i.e. it takes >1 caret movements to get past all glyphs), then it's probably a multi-glyph fallback or not a proper emoji render.
    function countRenderedCharacters(node) {
      // Create a selection and range to measure caret navigation in the DOM
      const range = document.createRange();
      range.selectNodeContents(node);

      // We will walk the range "caret position" through all visual grapheme clusters using Selection.modify("move", "right", "character")
      // IE11 and older don't support Selection.modify, but all modern browsers do.
      // As a fallback: count .textContent.length, but in our use case all modern browsers are expected.

      // Insert a dummy editable span to use Selection API
      const marker = document.createElement('span');
      marker.contentEditable = "true";
      marker.style.position = "absolute";
      marker.style.opacity = 0;
      marker.style.pointerEvents = "none";
      marker.style.userSelect = "text";
      marker.textContent = node.textContent || "";
      document.body.appendChild(marker);

      let count = 0;
      try {
        const sel = window.getSelection();
        sel.removeAllRanges();
        // Place caret at start
        range.selectNodeContents(marker);
        range.collapse(true);
        sel.removeAllRanges();
        sel.addRange(range);

        // Step caret until at end, counting movements
        let lastOffset = 0;
        while (true) {
          // Try moving right one character
          const oldAnchor = sel.anchorOffset;
          document.execCommand('selectNone'); // some browsers need a reset
          marker.focus();
          sel.removeAllRanges();
          // always collapse to front, some browsers are odd
          range.setStart(marker.firstChild || marker, 0);
          range.collapse(true);
          sel.removeAllRanges();
          sel.addRange(range);

          let moves = count;
          try {
            document.execCommand('selectNone');
          } catch (e) { }
          // Use Selection.modify to move caret right by one grapheme ("character")
          try {
            sel.modify("move", "right", "character");
          } catch (e) {
            // If unsupported, fallback
            break;
          }
          if ((sel.anchorOffset <= lastOffset) || (sel.anchorOffset >= (marker.textContent || "").length)) {
            // Did not move or reached the end
            break;
          }
          lastOffset = sel.anchorOffset;
          count += 1;
        }
        // Always add 1 for first move
        count += 1;
      } catch (e) {
        // Fallback: treat as length 1 (never broken)
        count = 1;
      }
      marker.remove();
      return count;
    }

    function isBrokenEmoji(node, emoji) {
      // Heuristics:
      // - Contains the replacement character "�"
      // - Contains visible whitespace
      // - Rendered much too small (e.g. as zero-width or <0.55x font size)
      // - Offset width/height is almost zero
      // - More than one rendered "character" (as per browser right-arrow navigation)
      const text = node.innerText || node.textContent || '';
      if (!text) return true;
      if (/\uFFFD/.test(text)) return true; // replacement character
      if (/\s/.test(text)) return true;
      // Check if size too small for emoji
      const fontSize = parseFloat(window.getComputedStyle(node).fontSize) || 16;
      if (node.offsetWidth < fontSize * 0.55) return true;
      if (node.offsetHeight < fontSize * 0.55) return true;

      // Check rendered character count
      const visualCharCount = countRenderedCharacters(node);
      if (visualCharCount > 1) return true;

      return false;
    }

    function spawnEmoji() {
      const wrapper = document.createElement("div");
      wrapper.className = "emoji-wrapper";

      // Set starting horizontal position and animation duration
      const left = Math.random() * (window.innerWidth - 48); // Subtract a bit for edge overflow
      const duration = 2 + Math.random() * 2.5; // seconds

      wrapper.style.left = `${left}px`;
      wrapper.style.top = `-50px`;
      wrapper.style.animationDuration = `${duration}s`;

      // 1 in 200 chance to show plink image instead of emoji
      const isPlink = Math.floor(Math.random() * 200 * emojis) === 0;

      let emojiNode, theEmoji;
      if (isPlink) {
        emojiNode = document.createElement("img");
        emojiNode.src = plinkSrc;
        emojiNode.alt = "plink";
        emojiNode.className = "emoji";
        emojiNode.style.borderRadius = "10px";

        const size = 24 + Math.random() * 30; // px
        emojiNode.style.width = `${size}px`;
        emojiNode.style.height = "auto";
      } else {
        emojiNode = document.createElement("span");
        emojiNode.className = "emoji";

        // Try up to 5 times to find a non-blacklisted, likely renderable emoji
        let tries = 0;
        do {
          theEmoji = randomEmoji();
          tries++;
        } while (emojiBlacklist.has(theEmoji) && tries < 5);

        emojiNode.textContent = theEmoji;
        // Font size and initial rotation
        const size = 1.1 + Math.random() * 2; // em
        emojiNode.style.fontSize = `${size}em`;
      }

      // Rotation for both emoji and plink
      const startRotation = Math.floor(Math.random() * 360);
      emojiNode.style.setProperty('--emoji-start-rotation', `${startRotation}deg`);
      emojiNode.style.animationDuration = `${duration}s`;

      // Add emoji or plink to wrapper, wrapper to display
      wrapper.appendChild(emojiNode);
      document.getElementById("display").appendChild(wrapper);

      if (!isPlink) {
        // Delay slightly to allow rendering
        setTimeout(() => {
          if (isBrokenEmoji(emojiNode, theEmoji)) {
            emojiBlacklist.add(theEmoji);

            wrapper.remove();
          }
        }, 100);
      }

      const totalTravel = window.innerHeight + 150; // from -50px to +100px past bottom
      const timeToDelete = duration * (totalTravel / (window.innerHeight + 50));
      setTimeout(() => {
        wrapper.remove();
      }, timeToDelete * 1000);
    }

    setInterval(() => {
      for (let i = 0; i < emojis; i++) {
        spawnEmoji();
      }
    }, 0);

</script>
</html>
