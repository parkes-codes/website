<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Emoji Rain</title>
  <link rel="icon" type="image/x-icon" href="icon.ico" />
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      position: relative;
      background: #111;
      color: #fff
    }
    #display {
      position: absolute;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }
    .emoji-wrapper {
      position: absolute;
      will-change: transform;
      pointer-events: none;
      user-select: none;
      animation: fall-wrapper linear;
    }
    .emoji {
      display: inline-block;
      will-change: transform;
      pointer-events: none;
      user-select: none;
      /* Animation: rotate emoji as it falls */
      animation: spin-emoji linear;
      /* --- Limit visible area to "1 emoji" --- */
      width: 1em;
      height: 1em;
      font-size: 2em; /* emoji size default */
      line-height: 1em;
      overflow: hidden;
      /* Avoid auto-sizing - force a strict box */
      box-sizing: content-box;
      /* Center the emoji nicely if font gives more than 1em */
      text-align: center;
      vertical-align: middle;
      /* Hide possible overflowed extra emojis */
      white-space: nowrap;
      /* Clip any part outside the box visually, never truncate string */
      text-overflow: clip;
      /* Prevent scaling with container */
      min-width: 1em;
      max-width: 1em;
      min-height: 1em;
      max-height: 1em;
    }

    @keyframes fall-wrapper {
      0% {
        transform: translateY(0);
        opacity: 1;
      }
      80% {
        opacity: 1;
      }
      100% {
        transform: translateY(calc(100vh + 100px));
      }
    }

    @keyframes spin-emoji {
      0% {
        transform: rotate(var(--emoji-start-rotation, 0deg));
      }
      100% {
        transform: rotate(calc(var(--emoji-start-rotation, 0deg) + 360deg));
      }
    }
    #speedinput {
        position: absolute;
        top: 5px;
        left: 5px;
        width: 100px;
        z-index: 10000;
    }
    #display2 {
        position: absolute;
        top: -10px;
        left: 115px;
        width: fit-content;
        z-index: 10000;
    }
  </style>
</head>
<body>
    <div id="display"></div>
  <input id="speedinput" type="range" min="60" max="100" step="0.01">
  <p id="display2"></p>
</body>
<script src="emojis.js"></script>
<script>
    const plinkSrc = "plinkk.gif";
    const speedinput = document.getElementById("speedinput");
    let speed = 50;
    let emojis = 0;

    function randomEmoji() {
      // Just pick from emojiList! No blacklist
      return emojiList[Math.floor(Math.random() * emojiList.length)];
    }

    function spawnEmoji() {
      const wrapper = document.createElement("div");
      wrapper.className = "emoji-wrapper";

      // Allow spawn Y *above* AND *below* the visible area (offscreen "above" == negative top)
      // -150px above screen to 60px into screen
      const minTop = -150;
      const maxTop = 60;
      const top = -100;
      const left = Math.random() * (window.innerWidth - 48); // Subtract a bit for edge overflow

      const duration = 2 + Math.random() * 2.5; // seconds

      wrapper.style.left = `${left}px`;
      wrapper.style.top = `${top}px`;
      wrapper.style.animationDuration = `${duration}s`;

      // 1 in 200 chance to show plink image instead of emoji
      const isPlink = Math.floor(Math.random() * 200 * emojis) === 0;

      let emojiNode, theEmoji;
      if (isPlink) {
        emojiNode = document.createElement("img");
        emojiNode.src = plinkSrc;
        emojiNode.alt = "plink";
        emojiNode.className = "emoji";
        emojiNode.style.borderRadius = "10px";

        const size = 24 + Math.random() * 30; // px
        emojiNode.style.width = `${size}px`;
        emojiNode.style.height = "auto";
      } else {
        emojiNode = document.createElement("span");
        emojiNode.className = "emoji";

        theEmoji = randomEmoji();

        emojiNode.textContent = theEmoji
        // Font size and initial rotation -- fontSize is already set default to 2em in CSS, but we can randomize
        const size = 1.1 + Math.random() * 2; // em
        emojiNode.style.fontSize = `${size}em`;
      }

      // Rotation for both emoji and plink
      const startRotation = Math.floor(Math.random() * 360);
      emojiNode.style.setProperty('--emoji-start-rotation', `${startRotation}deg`);
      emojiNode.style.animationDuration = `${duration}s`;

      // Add emoji or plink to wrapper, wrapper to display
      wrapper.appendChild(emojiNode);
      document.getElementById("display").appendChild(wrapper);

      // Travel distance: from that .top offscreen position to way past the bottom of window
      const totalTravel = window.innerHeight + 150 - top;
      const timeToDelete = duration * (totalTravel / (window.innerHeight + 50));
      setTimeout(() => {
        wrapper.remove();
      }, timeToDelete * 1000);
    }

    // --- Interval logic: Changeable interval ---
    let intervalId = null;
    let interval = 0;

    function getCurrentInterval() {
      const winW = window.innerWidth || 1;
      const speedValue = speedinput.value ? speedinput.value : 50;
       interval = ((100 - speedValue) * 3000) / winW;
      return Math.max(interval, 10); // clamp to at least 10ms to avoid weird rapid firing
    }

    function runRain() {
      emojis = Math.ceil(Math.pow(window.innerWidth, 1.5) / 5000);

      speed = 5000 / (Number(100-speedinput.value) - 33.333);
 
       document.getElementById("display2").textContent = `${(1-(interval/150)).toFixed(4)}`
      for (let i = 0; i < emojis; i++) {
        spawnEmoji();
      }
    }

    function resetInterval() {
      if (intervalId !== null) {
        clearInterval(intervalId);
      }
      const interval = getCurrentInterval();
      intervalId = setInterval(runRain, interval);
    }

    // Re-calculate interval on speed change or window resize
    speedinput.addEventListener('input', resetInterval);       // range changes
    window.addEventListener('resize', resetInterval);          // screen size changes

    // Start rain
    resetInterval();

</script>
</html>
